version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 * * MON%2"
      timezone: Europe/Bucharest
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 * * MON%2"
      timezone: Europe/Bucharest
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 * * MON%2"
      timezone: Europe/Bucharest
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 * * MON%2"
      timezone: Europe/Bucharest
