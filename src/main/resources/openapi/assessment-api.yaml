openapi: 3.0.3
info:
  title: Disease Prediction Assessment API
  description: >-
    Contract-first definition of the Disease Prediction backend's own REST API.
    This spec is the single source of truth for the request/response DTOs and the
    Spring API interface used by the web layer (MDD Iteration 2 — UC1 Patient Triage,
    FR-P1/FR-P2).
  version: 1.0.0

servers:
  - url: /
    description: Disease Prediction backend

tags:
  - name: Assessments
    description: Patient assessment submission and triage.

security:
  - bearerAuth: []

paths:
  /api/assessments:
    post:
      tags:
        - Assessments
      summary: Submit an assessment and receive a prediction result.
      description: >-
        Receives an assessment payload (free text and/or symptom entries), runs a
        lightweight emergency (red-flag) check, delegates prediction across the SOA
        boundary and returns the result. The request must carry at least one symptom
        signal (non-blank free text or at least one non-blank symptom entry); otherwise the
        server responds with 400. Requires a signed-in patient with an active consent
        (MDD Iteration 6); the patient is taken from the session token.
      operationId: submitAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
      responses:
        '200':
          description: Assessment processed; prediction result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '400':
          description: >-
            The payload carried no symptom signal (no free text and no non-blank symptom entries).
        '401':
          description: >-
            Missing, invalid, expired or revoked session token (WWW-Authenticate: Bearer).
        '403':
          description: >-
            Not a patient with an active consent: no profile yet
            (urn:pocket-doc:problem:profile-required), no verified primary email
            (urn:pocket-doc:problem:email-not-verified), consent not granted
            (urn:pocket-doc:problem:consent-required), a quarantined identity
            (urn:pocket-doc:problem:account-quarantined), or another role
            (urn:pocket-doc:problem:forbidden).
        '422':
          description: The prediction service could not identify a supported symptom.
        '502':
          description: The prediction service returned an invalid response or an error.
        '503':
          description: >-
            The prediction service is temporarily unavailable, or the identity service
            could not confirm the session (urn:pocket-doc:problem:identity-unavailable).

  /api/assessments/followup:
    post:
      tags:
        - Assessments
      summary: Answer a follow-up question and receive an updated prediction.
      description: >-
        Continues an adaptive assessment. When a previous prediction was below the
        confidence threshold, the prediction service offered a yes/no follow-up question
        about a symptom. The client answers it here, carrying back the symptoms confirmed
        and denied so far; the backend relays the answer across the SOA boundary and
        returns a re-ranked result, which may itself carry another follow-up question.
        The loop ends when the response's prediction result has needsFollowUp = false.
        Requires a signed-in patient with an active consent (MDD Iteration 6); the patient
        is taken from the session token.
      operationId: submitFollowup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupRequest'
      responses:
        '200':
          description: Follow-up processed; updated prediction result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '400':
          description: The payload carried no confirmed symptoms to predict from.
        '401':
          description: >-
            Missing, invalid, expired or revoked session token (WWW-Authenticate: Bearer).
        '403':
          description: >-
            Not a patient with an active consent (see POST /api/assessments for the
            problem types).
        '422':
          description: The prediction service could not identify a supported symptom.
        '502':
          description: The prediction service returned an invalid response or an error.
        '503':
          description: >-
            The prediction service is temporarily unavailable, or the identity service
            could not confirm the session (urn:pocket-doc:problem:identity-unavailable).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Hanko session token, sent as "Authorization: Bearer <token>".'
  schemas:
    AssessmentRequest:
      type: object
      description: >-
        Inbound contract for POST /api/assessments. Platform-independent API model that
        both the Java backend and the Python prediction service are derived from. A request
        is only meaningful when it carries at least one signal to analyse: non-blank free
        text or at least one non-blank symptom entry (enforced by the web layer, producing a 400 for
        empty payloads).
      properties:
        patientId:
          type: string
          format: uuid
          deprecated: true
          description: >-
            Ignored. The patient is taken from the session token (MDD Iteration 6); a
            browser-supplied id is never trusted as proof of ownership.
        freeText:
          type: string
          description: Raw patient free-text description (may be blank).
        symptomEntries:
          type: array
          description: Structured, severity-weighted symptom entries.
          items:
            $ref: '#/components/schemas/SymptomEntry'

    SymptomEntry:
      type: object
      description: >-
        A single symptom entry in an assessment request. Mirrors the Python prediction
        service SymptomEntryDTO across the SOA boundary.
      properties:
        rawText:
          type: string
          description: The raw symptom text as entered by the patient.
        severity:
          $ref: '#/components/schemas/Severity'
        durationDays:
          type: integer
          format: int32
          description: How long the symptom has been present, in days.
        isMapped:
          type: boolean
          description: Whether the raw text has been mapped to a known symptom.

    Severity:
      type: string
      description: Reported severity of a symptom.
      enum:
        - MILD
        - MODERATE
        - SEVERE

    AssessmentResponse:
      type: object
      description: Outbound contract for POST /api/assessments.
      properties:
        assessmentId:
          type: string
          format: uuid
          description: Identifier generated for this assessment.
        emergencyDetected:
          type: boolean
          description: >-
            True when the prediction service reported urgency EMERGENCY (call an ambulance,
            112). Kept for older clients; result.highestUrgency carries the full level.
        result:
          $ref: '#/components/schemas/PredictionResult'
          nullable: true

    FollowupAnswer:
      type: object
      description: The patient's yes/no answer to a previous follow-up question.
      required:
        - symptom
        - present
      properties:
        symptom:
          type: string
          description: Canonical symptom name the question was about.
        present:
          type: boolean
          description: The patient's answer - true for yes, false for no.

    FollowupRequest:
      type: object
      description: >-
        Inbound contract for POST /api/assessments/followup. The client carries back the
        symptoms confirmed and denied so far (the loop is stateless on the server) plus the
        answer to the most recent question.
      properties:
        confirmedSymptoms:
          type: array
          description: Canonical symptom names known present so far (original parse + every yes).
          items:
            type: string
        deniedSymptoms:
          type: array
          description: Canonical symptom names answered no so far, carried so they are not re-asked.
          items:
            type: string
        answer:
          $ref: '#/components/schemas/FollowupAnswer'
          nullable: true
        roundsUsed:
          type: integer
          format: int32
          description: How many follow-up questions have already been answered (caps the loop).

    PredictionResult:
      type: object
      description: >-
        A prediction result. This is the value the prediction service returns and the
        backend relays to the patient.
      properties:
        resultId:
          type: string
          format: uuid
          description: Identifier of the prediction result.
        generatedAt:
          type: string
          format: date-time
          description: Instant the prediction was generated.
        disclaimer:
          type: string
          description: Non-diagnostic disclaimer accompanying the result.
        predictions:
          type: array
          description: Ranked disease predictions.
          items:
            $ref: '#/components/schemas/DiseasePrediction'
        activeSymptoms:
          type: array
          description: >-
            Canonical symptoms currently known present. Echoed back so the client can carry
            them into a follow-up request.
          items:
            type: string
        needsFollowUp:
          type: boolean
          description: >-
            True when confidence is below the threshold and a follow-up question is offered.
        followUp:
          $ref: '#/components/schemas/FollowUp'
          nullable: true
        redFlags:
          type: array
          description: >-
            Red-flag rules fired by the active symptoms, most urgent first. Computed by the
            prediction service, which is the single source of truth for urgency.
          items:
            $ref: '#/components/schemas/RedFlag'
        highestUrgency:
          $ref: '#/components/schemas/Urgency'
          nullable: true

    Urgency:
      type: string
      description: >-
        How urgently the patient needs care, driven by symptoms (never by a disease's
        precaution text). EMERGENCY = call an ambulance (112) or go to the nearest emergency
        department now; URGENT = see a doctor promptly today; ADVISORY = worth mentioning.
        Absent (null) when no red flag fired.
      enum:
        - EMERGENCY
        - URGENT
        - ADVISORY

    RedFlag:
      type: object
      description: A red-flag rule that fired for the reported symptoms.
      properties:
        name:
          type: string
          description: Rule identifier, e.g. possible_cardiac_event.
        urgency:
          $ref: '#/components/schemas/Urgency'
        message:
          type: string
          description: Patient-facing instruction (e.g. call 112, or see a doctor promptly).
        matchedSymptoms:
          type: array
          description: Canonical symptoms that triggered the rule.
          items:
            type: string

    FollowUp:
      type: object
      description: >-
        A yes/no question that would sharpen a low-confidence prediction (FR-P3 adaptive
        questioning). The client shows the question, collects the answer, and posts it to
        POST /api/assessments/followup.
      properties:
        symptom:
          type: string
          description: Canonical symptom name to answer yes/no about.
        question:
          type: string
          description: Human-readable yes/no question to show the patient.
        topDisease:
          type: string
          description: Current most-likely disease the question tries to confirm.
        confidence:
          type: number
          format: double
          description: Current confidence in the top disease (0..1).

    DiseasePrediction:
      type: object
      description: >-
        A single ranked disease prediction (FR-P2: ranked likely diseases with a
        calibrated probability score).
      properties:
        rank:
          type: integer
          format: int32
          description: Rank of this prediction within the result (1 is most likely).
        probability:
          type: number
          format: double
          description: Calibrated probability score for this disease.
        diseaseName:
          type: string
          description: Name of the predicted disease.
        description:
          type: string
          nullable: true
          description: Human-readable description of the disease, when available.
        precautions:
          type: array
          description: Recommended precautions for the disease (may be empty).
          items:
            type: string
        explanation:
          $ref: '#/components/schemas/Explanation'

    Explanation:
      type: object
      description: A prediction explanation.
      properties:
        summary:
          type: string
          description: Human-readable summary of why this disease was predicted.
        contributionWeights:
          type: object
          description: Per-feature contribution weights keyed by feature name.
          additionalProperties:
            type: number
            format: double
