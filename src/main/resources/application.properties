spring.application.name=disease-prediction-be

# Local database credentials come from the gitignored .env file, the same one docker compose uses.
# See README "Local database". In tests, Testcontainers provides the connection instead.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:disease_prediction}
spring.datasource.username=${POSTGRES_USER:disease_prediction}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that the
# entities match it and never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Internal Python prediction service. Override with PREDICTION_SERVICE_BASE_URL in Docker/Kubernetes.
app.prediction.base-url=${PREDICTION_SERVICE_BASE_URL:http://localhost:8000}
app.prediction.top-k=${PREDICTION_TOP_K:5}

# AES-256 key (Base64, 32 bytes) for field-level encryption of personal data (FieldEncryptor).
# No default on purpose: the app refuses to start without a valid key.
app.encryption.key=${DATA_ENCRYPTION_KEY:}
# Authentication with Hanko (MDD Iteration 6). Every /api/** request needs a Hanko session JWT in
# "Authorization: Bearer". The defaults point at the local Hanko from compose.yaml; Kubernetes sets
# the HANKO_* variables (see docs repo, mdd/iteration6/README.md, "Environments").
# Hanko has no OpenID discovery, so the JWKS URL is set explicitly. Hanko signs with RS256 only.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${HANKO_ISSUER:http://localhost:8100}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${HANKO_JWKS_URI:http://localhost:8100/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${HANKO_AUDIENCE:pocket-doc-local}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
# Hanko public API for POST /sessions/validate (logout and revocation). Results are reused for
# app.auth.hanko.session-check-ttl, so a logout reaches the API within that time.
app.auth.hanko.api-url=${HANKO_API_URL:http://localhost:8100}
app.auth.hanko.session-check-ttl=${HANKO_SESSION_CHECK_TTL:60s}
# Optional legacy identity denylist; when enabled the file is required and must contain UUIDs.
app.auth.hanko.quarantine.enabled=${HANKO_QUARANTINE_ENABLED:false}
app.auth.hanko.quarantine.file=${HANKO_QUARANTINE_FILE:}
