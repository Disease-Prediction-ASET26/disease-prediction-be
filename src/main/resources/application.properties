spring.application.name=disease-prediction-be

# Local database credentials come from the gitignored .env file, the same one docker compose uses.
# See README "Local database". In tests, Testcontainers provides the connection instead.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:disease_prediction}
spring.datasource.username=${POSTGRES_USER:disease_prediction}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that the
# entities match it and never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# AES-256 key (Base64, 32 bytes) for field-level encryption of personal data (FieldEncryptor).
# No default on purpose: the app refuses to start without a valid key.
app.encryption.key=${DATA_ENCRYPTION_KEY:}
